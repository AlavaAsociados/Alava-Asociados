  <rect x="414" y="258" width="154" height="24" rx="4" fill="#121519" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
  <text x="424" y="274" fill="#34D399" font-family="monospace" font-size="10.5" font-weight="bold">CCC = DSO + DIO - DPO</text>

  <text x="414" y="296" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8">Reducción de 5-10 días</text>
  <text x="414" y="308" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8">libera liquidez operativa directa.</text>
  <text x="414" y="324" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="bold">Impacto directo en ROIC</text>
</svg>
