  <text x="85" y="66" fill="#10B981" font-family="monospace" font-size="10.5" font-weight="bold">5,983.2 ▲</text>
  <text x="160" y="66" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold">NASDAQ</text>
  <text x="215" y="66" fill="#10B981" font-family="monospace" font-size="10.5" font-weight="bold">20,845 ▲</text>
  <text x="290" y="66" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold">WTI OIL</text>
  <text x="342" y="66" fill="#10B981" font-family="monospace" font-size="10.5" font-weight="bold">$71.40 ▲</text>
  <text x="415" y="66" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold">ORO</text>
  <text x="450" y="66" fill="#10B981" font-family="monospace" font-size="10.5" font-weight="bold">$2,684 ▲</text>
