  <text x="414" y="117" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="bold">Convertidor Ejecutivo</text>
  
  <rect x="414" y="126" width="154" height="22" rx="4" fill="#121519" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
  <text x="422" y="141" fill="#FFFFFF" font-family="monospace" font-size="11" font-weight="bold">1,000 USD</text>
  <text x="535" y="141" fill="#10B981" font-family="sans-serif" font-size="9">⇄ MXN</text>

  <rect x="414" y="154" width="154" height="42" rx="5" fill="#121519" stroke="rgba(16, 185, 129, 0.25)" stroke-width="1"/>
  <text x="440" y="174" fill="#FFFFFF" font-family="monospace" font-size="15" font-weight="bold">20,350.00</text>
  <text x="515" y="174" fill="#10B981" font-family="sans-serif" font-size="9.5" font-weight="bold">MXN</text>
  <text x="430" y="188" fill="#71717A" font-family="sans-serif" font-size="7.5">API Conectada en Tiempo Real</text>

  <!-- Widget 2: KPI Destacado (CCC) -->
  <rect x="402" y="218" width="178" height="122" rx="8" fill="url(#cardBg)" stroke="rgba(16, 185, 129, 0.45)" stroke-width="1"/>
  <text x="414" y="235" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="bold">KPI DESTACADO</text>
