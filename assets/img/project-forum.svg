  <rect y="26" width="600" height="12" fill="#20252D"/>
  <circle cx="25" cy="19" r="5" fill="#EF4444" opacity="0.85"/>
  <circle cx="42" cy="19" r="5" fill="#F59E0B" opacity="0.85"/>
  <circle cx="59" cy="19" r="5" fill="#10B981" opacity="0.85"/>

  <!-- Address Bar -->
