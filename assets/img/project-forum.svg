  <text x="48" y="212" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="bold">CONCLUSIÓN EJECUTIVA:</text>
  <text x="48" y="226" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">La analítica predictiva en P&amp;L y control estricto de OPEX</text>
  <text x="48" y="238" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">protegen el margen EBITDA en industrias de alto CAPEX.</text>

  <!-- Chart Preview -->
  <path d="M45 315 L 110 285 L 175 295 L 240 265 L 305 275 L 360 255" fill="none" stroke="url(#emeraldGrad)" stroke-width="2.5"/>
  <circle cx="240" cy="265" r="3.5" fill="#10B981"/>
  <circle cx="360" cy="255" r="3.5" fill="#34D399"/>
  <text x="36" y="325" fill="#71717A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5">52 Recomendaciones • 4 Comentarios activos</text>

