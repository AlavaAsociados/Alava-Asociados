<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#2A2E35" />
    </linearGradient>
    <linearGradient id="grad-avatar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#A1A1AA" />
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="200" cy="200" r="190" fill="url(#grad-bg)" opacity="0.25" stroke="#10B981" stroke-width="2"/>
  <!-- Inner Ring -->
  <circle cx="200" cy="200" r="160" fill="#1A1D21" stroke="#2A2E35" stroke-width="1.5"/>
  <!-- Head -->
  <circle cx="200" cy="150" r="55" fill="url(#grad-avatar)" />
  <!-- Hair -->
  <path d="M145 145 C145 100, 255 100, 255 145 C255 125, 230 110, 200 110 C170 110, 145 125, 145 145 Z" fill="#10B981" />
  <!-- Glasses -->
  <rect x="160" y="140" width="32" height="20" rx="4" fill="#121417" stroke="#10B981" stroke-width="2.5" />
  <rect x="208" y="140" width="32" height="20" rx="4" fill="#121417" stroke="#10B981" stroke-width="2.5" />
  <line x1="192" y1="150" x2="208" y2="150" stroke="#10B981" stroke-width="2.5" />
  <!-- Smile -->
  <path d="M185 180 Q200 192 215 180" fill="none" stroke="#121417" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Body / Shoulders -->
  <path d="M110 310 C110 230, 150 220, 200 220 C250 220, 290 230, 290 310 Z" fill="url(#grad-avatar)" />
  <path d="M170 220 L200 260 L230 220 Z" fill="#10B981" opacity="0.85" />
  <text x="65" y="100" font-family="sans-serif" font-size="22" font-weight="bold" fill="#10B981" opacity="0.8">KPIs</text>
  <text x="290" y="290" font-family="monospace" font-size="26" font-weight="bold" fill="#E4E4E7" opacity="0.7">&lt;/&gt;</text>
</svg>