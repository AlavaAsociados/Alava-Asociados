  <!-- Iniciales AA en verde esmeralda -->
  <text x="32" y="42" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="25" font-weight="800" fill="#10B981" text-anchor="middle" letter-spacing="1.5">AA</text>
